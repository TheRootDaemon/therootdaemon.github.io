<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet"
    />
    {{ $styles := slice (resources.Get "css/rose-pine.css") (resources.Get
    "css/base.css") (resources.Get "css/syntax.css") (resources.Get
    "css/components.css") | resources.Concat "css/main.css" | minify |
    fingerprint }}
    <link rel="stylesheet" href="{{ $styles.RelPermalink }}" />
</head>

<body>
    {{ block "main" . }}{{ end }} {{ partial "navbar.html" . }}
</body>

</html>
