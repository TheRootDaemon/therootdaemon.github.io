<footer class="site-footer">
    <div class="footer-inner">
        {{ if .IsHome }}
        <span class="handle"> TheRootDaemon </span>
        {{ else }}
        <a class="handle" href="/"> TheRootDaemon </a>
        {{ end }}
        <nav class="footer-nav" aria-label="Main">
            {{ if and (eq .Section "blog") .IsSection }}
            <span class="handle">Blog</span>
            {{ else }}
            <a class="handle" href="/blog/">Blog</a>
            {{ end }} {{ if and (eq .Section "books") .IsSection }}
            <span class="handle">Books</span>
            {{ else }}
            <a class="handle" href="/books/">Books</a>
            {{ end }} {{ if and (eq .Section "works") .IsSection }}
            <span class="handle">Works</span>
            {{ else }}
            <a class="handle" href="/works/">Works</a>
            {{ end }}
        </nav>
    </div>
</footer>
