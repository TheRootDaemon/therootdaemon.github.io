{{ define "main" }}
<main class="container">
    <header class="hero">
        <h1>{{ .Params.name }}</h1>
        <p class="tagline">{{ .Params.tagline }}</p>
    </header>
    <section class="about">{{ .Content }}</section>
    <nav class="links" aria-label="Find me online">
        {{ range .Params.links }}
        <a href="{{ .url }}" target="_blank" rel="noopener">{{ .label }}</a>
        {{ end }}
    </nav>
</main>
{{ end }}
